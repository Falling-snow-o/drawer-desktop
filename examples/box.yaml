# ============================================================
#  boxrun 配置 —— 唯一的"铭牌"
#
#  只写你真正会改的字段。其他全部有默认值。
#  改完不用重启任何东西，下一次 up 生效。
# ============================================================

schema: 1
name: lab

# ------------------------------------------------------------ 底层镜像
# rootfs 放在 blobs/ 下，只读写一次，之后永不修改。
# 下载失败时可以手动下好放到 blobs/<image>。
distro:
  image: ubuntu-base-24.04.3-base-amd64.tar.gz
  url: https://cdimage.ubuntu.com/ubuntu-base/releases/24.04/release/ubuntu-base-24.04.3-base-amd64.tar.gz
  packages: pcmanfm gcc libc6-dev

# ------------------------------------------------------------ 资源天花板
# 全部由箱内的 cgroup v2 执行，不改全局 .wslconfig。
# cpu 格式: "<配额> <周期>"，100000 周期 = 100ms，400000 配额 = 4 核
quota:
  cpu: 200000 100000
  memory: 4G
  pids: 512

# ------------------------------------------------------------ GPU
# vram = 0 → 不限制；> 0 → up 时在箱内编译 LD_PRELOAD 闸门（源码 vram\boxrun-vram.c），
# 累计显存分配超过这个 MiB 数就返回 CUDA OOM。
# 只对通过 exec 启动的进程生效；GeForce 没有 MIG，这不是硬件切分（见 PITFALLS 4.3）。
gpu:
  visible: 0
  vram: 4096

# ------------------------------------------------------------ 存储
# bind = 直接用抽屉里的 data/ 目录（Windows 侧可直接双击打开）
store:
  type: bind
  target: /work

# ------------------------------------------------------------ 电源
# session = up 时持有唤醒声明，down 时自动撤销（不改电源计划）
# off     = 什么都不做
# forever = 真的写 powercfg（不推荐，需手动还原）
power:
  keep_awake: session

# ------------------------------------------------------------ 网络
# publish 留空 = 一条端口转发规则都不建。
# Windows 自己访问用 localhost:端口 即可，不需要转发。
net:
  publish: []
