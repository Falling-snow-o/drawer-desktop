name: ci
on: [push, pull_request]

jobs:
  static-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: PowerShell 语法 + 编译
        shell: pwsh
        run: ./test/ci.ps1
