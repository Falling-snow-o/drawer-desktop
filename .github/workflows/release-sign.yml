name: release-sign

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build installer from source
        shell: pwsh
        run: ./打包.ps1 -SkipTest -Version "${{ inputs.version }}"

      - name: Print SHA256
        shell: pwsh
        run: Get-FileHash dist/drawer-setup.exe -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: drawer-unsigned
          path: dist/drawer-setup.exe
          if-no-files-found: error

  sign:
    needs: build
    # 只有配置了 SignPath 才执行；未配置时构建任务照常跑
    if: vars.SIGNPATH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Submit signing request to SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - uses: actions/upload-artifact@v4
        with:
          name: drawer-signed
          path: signed/drawer-setup.exe
          if-no-files-found: error
